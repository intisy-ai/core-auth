plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "0.8.0"
}

rootProject.name = "core-auth-java"

// :accounts    - AccountManager/AccountStore/AuthConfig/OAuth/Selection engine (Java 8, its only
//                dependency is the plugin-to-host :spi contract, no gson/net/nio/reflect/threads,
//                so it stays TeaVM-transpilable).
// :auth-teavm  - TeaVM JS export surface over :accounts (CoreAuthJs) -> generateJavaScript emits
//                an ES2015 module (core-auth.js). Reuses :js-base's TeaVM service implementations
//                (SimpleJsonCodec/JsStoreBridge/JsHttpClientBridge) instead of duplicating them.
//                Named "auth-teavm" rather than "teavm" so it cannot collide with another repo's
//                own ":teavm" project path when this build is folded into a larger one.
include ":accounts"
include ":auth-teavm"

// :spi and :js-base - the plugin-to-host contract and the TeaVM implementations of its
// host-injected services, from the core-contracts submodule (../../core-contracts from here).
// core-auth needs the CONTRACT, never the routing engine: it hands a provider its accounts, and the
// engine is a separate consumer of the same contract. The project paths are preserved and only
// projectDir differs, the ecosystem convention, so a larger build folding this one in resolves the
// same coordinates.
include ":spi"
project(":spi").projectDir = file("../../core-contracts/java/spi")

include ":js-base"
project(":js-base").projectDir = file("../../core-contracts/java/js-base")

// :ir - core-ir's canonical IR types, from this repo's own core-ir submodule, which is also what
// src/types.ts and src/provider-capability.ts import. One :ir per build, and no drift between
// core-auth's Java and TypeScript views of core-ir.
include ":ir"
project(":ir").projectDir = file("../../core-ir/java/ir")
