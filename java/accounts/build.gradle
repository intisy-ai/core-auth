// AccountManager/AccountStore/AuthConfig/OAuth/Selection engine. Depends on the plugin-to-host :spi
// contract for the shared SPIs (Store/HttpClient/JsonCodec/Clock/Random) rather than duplicating
// them, and `api` rather than `implementation` so those SPI types are visible on this module's own
// consumers' compile classpath too: :auth-teavm's CoreAuthJs declares AccountManager fields typed
// against Store/HttpClient/JsonCodec directly. Zero OTHER dependencies by design (no gson/
// java.net/java.nio/reflection/threads) so this module stays TeaVM-transpilable, matching :spi's own
// zero-dependency policy.
dependencies {
    api project(":spi")
}
