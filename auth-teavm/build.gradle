import org.teavm.gradle.api.JSModuleType
import org.teavm.gradle.api.OptimizationLevel

plugins {
    id "org.teavm" version "0.15.0"
}

dependencies {
    // :accounts -- the account/oauth engine this JS export surface wraps.
    implementation project(":accounts")
    // :seam and :js-base carry the seam implementations (SimpleJsonCodec, InMemoryStore, JsStoreBridge,
    // JsHttpClientBridge), reused rather than duplicated; CoreAuthJs lives in :js-base's own package
    // (io.github.intisy.ai.js) so it references those two unqualified.
    githubImplementation "intisy-ai:api:1.7.0:seam"
    githubImplementation "intisy-ai:api:1.7.0:js-base"
    // SOURCE-retention, so nothing here reaches the bundle. The processor jar is a release asset and
    // carries no transitive metadata, so the annotation types it reads are named beside it.
    githubCompileOnly "intisy-ai:api:1.7.0:annotations"
    githubAnnotationProcessor "intisy-ai:api:1.7.0:processor"
    githubAnnotationProcessor "intisy-ai:api:1.7.0:annotations"
    teavm teavm.libs.jsoApis
}

// The root subprojects{} block pins Java 8 (sourceCompatibility/targetCompatibility +
// compileJava --release 8) for portability of :accounts. TeaVM 0.15.0's own classlib/jso-apis/
// extension-spi artifacts publish a minimum JVM-version metadata of 11-17, so :teavm needs a
// newer compile target than :accounts -- override both the extension's compatibility (fixes
// Gradle's dependency-resolution JVM-version attribute matching) and the compileJava task's
// --release option. Mirrors core-proxy/teavm/build.gradle exactly (which itself mirrors
// ai-java's js/build.gradle).
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.named("compileJava") {
    options.release = 17
    options.compilerArgs << "-Atsemit.name=core-auth.teavm"
}

// Same JVM-version attribute matching problem as compileJava, now that the root block also
// pins compileTestJava to release 8: this module's test classpath depends on project :teavm,
// which requires 17.
tasks.named("compileTestJava") {
    options.release = 17
}

teavm.js {
    mainClass = "io.github.intisy.ai.js.CoreAuthJs"
    moduleType = JSModuleType.ES2015
    obfuscated = false
    optimization = OptimizationLevel.NONE
    targetFileName = "core-auth.js"
}
