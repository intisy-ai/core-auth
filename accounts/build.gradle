// AccountManager/AccountStore/AuthConfig/OAuth/Selection engine. Depends on api's :contract for the
// injected seams (Store/HttpClient/JsonCodec/Clock/Random) rather than duplicating them, and `api`
// rather than `implementation` so those types are visible on this module's own consumers' compile
// classpath too: :auth-teavm's CoreAuthJs declares AccountManager fields typed against
// Store/HttpClient/JsonCodec directly. Zero OTHER dependencies by design (no gson/java.net/java.nio/
// reflection/threads) so this module stays TeaVM-transpilable.
dependencies {
    githubApi "intisy-ai:api:1.7.0:contract"

    // :seam carries the JSON narrowing helpers the stores hand-roll their Map<->POJO conversion
    // through, and the seam implementations the tests exercise instead of a local double.
    githubImplementation "intisy-ai:api:1.7.0:seam"
}
